[package]
name = "apg-id-maker"
version = "1.21.0"
description = "Alpha Premier ID Maker"
authors = ["Alpha Premier Group of Companies"]
edition = "2021"
# Tauri 2.12 itself needs 1.90. Saying so here makes cargo complain
# about the toolchain rather than about a dependency nobody chose.
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# devtools is a Cargo feature, not a setting: without it the web
# inspector is compiled out of release builds, and a problem on the
# issuing laptop becomes undiagnosable. The old C# shell left it on for
# the same reason.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }
